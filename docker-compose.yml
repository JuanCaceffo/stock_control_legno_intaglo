version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: legno_intaglo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legno_intaglo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: legno_intaglo_app
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/legno_intaglo
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
